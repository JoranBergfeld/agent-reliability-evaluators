<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <title>Fault robustness as a function of the accuracy under the fault, for a baseline accuracy of 0.5</title>
  <desc>The value rises in a straight line from 0, when no Attempt under the fault succeeds, to 1, when the accuracy under the fault equals the baseline accuracy of 0.5. Beyond that it stays at 1. The ratio before the cap keeps rising, to 1.5 at an accuracy of 0.75 and to 2 at an accuracy of 1, and the value does not show it.</desc>
  <rect width="640" height="350" fill="#ffffff"/>
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="70" y1="50" x2="550" y2="50"/>
    <line x1="70" y1="100" x2="550" y2="100"/>
    <line x1="70" y1="150" x2="550" y2="150"/>
    <line x1="70" y1="200" x2="550" y2="200"/>
    <line x1="190" y1="50" x2="190" y2="250"/>
    <line x1="310" y1="50" x2="310" y2="250"/>
    <line x1="430" y1="50" x2="430" y2="250"/>
    <line x1="550" y1="50" x2="550" y2="250"/>
  </g>
  <g stroke="#424242" stroke-width="1.5">
    <line x1="70" y1="250" x2="550" y2="250"/>
    <line x1="70" y1="50" x2="70" y2="250"/>
  </g>
  <g fill="#424242" text-anchor="middle">
    <text x="70" y="268">0</text>
    <text x="190" y="268">0.25</text>
    <text x="310" y="268">0.5</text>
    <text x="430" y="268">0.75</text>
    <text x="550" y="268">1</text>
    <text x="310" y="294">Accuracy under the fault, for a baseline accuracy of 0.5</text>
  </g>
  <g fill="#424242" text-anchor="end">
    <text x="62" y="254">0</text>
    <text x="62" y="204">0.5</text>
    <text x="62" y="154">1</text>
    <text x="62" y="104">1.5</text>
    <text x="62" y="54">2</text>
  </g>
  <text x="22" y="150" fill="#424242" text-anchor="middle" transform="rotate(-90 22 150)">Accuracy under the fault / baseline accuracy</text>

  <path d="M310,150 L550,50" fill="none" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M70,250 L310,150 L550,150" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="73" y1="243" x2="92" y2="196" stroke="#9e9e9e" stroke-width="1"/>
  <circle cx="430" cy="100" r="5" fill="#ffffff" stroke="#9e9e9e" stroke-width="2"/>
  <g fill="#1565c0">
    <circle cx="70" cy="250" r="5"/>
    <circle cx="190" cy="200" r="5"/>
    <circle cx="310" cy="150" r="5"/>
    <circle cx="430" cy="150" r="5"/>
  </g>
  <g fill="#212121" font-weight="600">
    <text x="88" y="190">no success: 0</text>
    <text x="202" y="216">half of the baseline kept: 0.5</text>
    <text x="298" y="140" text-anchor="end">as good as the baseline: 1</text>
    <text x="430" y="172" text-anchor="middle">better than the baseline: still 1</text>
  </g>
  <g fill="#616161">
    <text x="418" y="92" text-anchor="end">the ratio is 1.5, and the cap hides it</text>
    <text x="562" y="154">value</text>
    <text x="562" y="54">ratio</text>
  </g>
  <text x="70" y="318" fill="#616161">Solid: fault robustness, min(ratio, 1).</text>
  <text x="70" y="336" fill="#616161">Dashed: the ratio before the cap, which the scorecard keeps as accuracy_ratio.</text>
</svg>

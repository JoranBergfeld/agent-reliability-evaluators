<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>One Task, its own prompt and three prompt variants, all judged by the one task-success rule of the Task</title>
  <desc>The Task add has the prompt "Add 'buy milk' to my list." and three prompt variants that the customer supplies or approves: polite, casual and terse. The agent is given each text exactly as it is, and every Attempt is judged by the same task-success rule, which reads the state of the service. The variant terse, "Milk.", leaves out what to do. The metric cannot tell whether it changed the Task.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#757575"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#ffffff"/>

  <text x="20" y="30" fill="#616161" font-weight="600">Baseline: the Task's own prompt</text>
  <rect x="20" y="40" width="440" height="44" rx="6" fill="#fafafa" stroke="#bdbdbd"/>
  <text x="36" y="67" fill="#212121">"Add 'buy milk' to my list."</text>

  <text x="20" y="116" fill="#616161" font-weight="600">Variation: the prompt variants, which you supply or approve</text>
  <rect x="20" y="126" width="440" height="44" rx="6" fill="#fafafa" stroke="#1565c0" stroke-width="1.5"/>
  <text x="36" y="146" fill="#1565c0" font-size="12" font-weight="600">polite</text>
  <text x="36" y="163" fill="#212121">"Could you put 'buy milk' on my list, please?"</text>

  <rect x="20" y="180" width="440" height="44" rx="6" fill="#fafafa" stroke="#1565c0" stroke-width="1.5"/>
  <text x="36" y="200" fill="#1565c0" font-size="12" font-weight="600">casual</text>
  <text x="36" y="217" fill="#212121">"buy milk -&gt; my list pls"</text>

  <rect x="20" y="234" width="440" height="44" rx="6" fill="#fff8e1" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="36" y="254" fill="#ef6c00" font-size="12" font-weight="600">terse</text>
  <text x="36" y="271" fill="#212121">"Milk."</text>
  <text x="130" y="254" fill="#ef6c00" font-size="12">Leaves out what to do. Did it change the Task?</text>
  <text x="130" y="271" fill="#ef6c00" font-size="12">The metric cannot tell.</text>

  <g fill="none" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M460,62 C510,62 520,140 568,150"/>
    <path d="M460,148 C500,148 520,160 568,162"/>
    <path d="M460,202 C500,202 520,178 568,174"/>
    <path d="M460,256 C510,256 520,196 568,186"/>
  </g>

  <rect x="570" y="110" width="190" height="116" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <g fill="#212121">
    <text x="586" y="134" font-weight="600">One task-success rule</text>
    <text x="586" y="158">'buy milk' is on the list,</text>
    <text x="586" y="176">exactly once.</text>
    <text x="586" y="204" fill="#616161" font-size="12">Read from the service,</text>
    <text x="586" y="219" fill="#616161" font-size="12">not from the answer.</text>
  </g>

  <g fill="#212121">
    <text x="20" y="318" font-weight="600">The same: the Task, its task-success rule, the tools, the data and the number of Attempts.</text>
    <text x="20" y="340" font-weight="600">Different: only the wording, which the agent is given exactly as you wrote it.</text>
  </g>
  <g fill="#616161">
    <text x="20" y="370">Every Attempt records the variant it ran under, with its exact text and its source.</text>
    <text x="20" y="390">The offering generates no variant. That a variant is equivalent is your claim.</text>
  </g>
</svg>

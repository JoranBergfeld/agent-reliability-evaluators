<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Worked example: five Tasks, four of them eligible</title>
  <desc>close has two Attempts that read then update and one that updates then reads: pair distances 0, 1 and 1, Task value 0.3333. archive has read, update against update, delete: distance 1, Task value 0. reorder has read, create, update, delete against read, update, delete, create: distance 0.5, Task value 0.5. tidy has read, update against an Attempt that took no action: distance 1, Task value 0. once has an Attempt that was not recorded and is excluded. The mean of the four eligible Task values is 0.2083.</desc>
  <defs>
    <g id="read">
      <rect width="50" height="16" rx="3" fill="#1565c0"/>
      <text x="25" y="12" fill="#ffffff" font-size="10" text-anchor="middle">read</text>
    </g>
    <g id="create">
      <rect width="50" height="16" rx="3" fill="#2e7d32"/>
      <text x="25" y="12" fill="#ffffff" font-size="10" text-anchor="middle">create</text>
    </g>
    <g id="update">
      <rect width="50" height="16" rx="3" fill="#ef6c00"/>
      <text x="25" y="12" fill="#ffffff" font-size="10" text-anchor="middle">update</text>
    </g>
    <g id="delete">
      <rect width="50" height="16" rx="3" fill="#c62828"/>
      <text x="25" y="12" fill="#ffffff" font-size="10" text-anchor="middle">delete</text>
    </g>
  </defs>
  <rect width="700" height="440" fill="#ffffff"/>
  <g fill="#616161" font-weight="600">
    <text x="20" y="30">Task</text>
    <text x="110" y="30">Actions of each Attempt, in order</text>
    <text x="350" y="30">Pair distances</text>
    <text x="560" y="30">Task value</text>
  </g>
  <line x1="20" y1="42" x2="680" y2="42" stroke="#bdbdbd"/>

  <g fill="#212121">
    <text x="20" y="68">close</text>
    <use href="#read" x="110" y="56"/>
    <use href="#update" x="164" y="56"/>
    <use href="#read" x="110" y="76"/>
    <use href="#update" x="164" y="76"/>
    <use href="#update" x="110" y="96"/>
    <use href="#read" x="164" y="96"/>
    <text x="350" y="68">0, 1, 1: mean 2/3</text>
    <text x="560" y="68">1 − 2/3 = 0.3333</text>

    <text x="20" y="142">archive</text>
    <use href="#read" x="110" y="130"/>
    <use href="#update" x="164" y="130"/>
    <use href="#update" x="110" y="150"/>
    <use href="#delete" x="164" y="150"/>
    <text x="350" y="142">2 / 2 = 1</text>
    <text x="560" y="142">1 − 1 = 0</text>

    <text x="20" y="196">reorder</text>
    <use href="#read" x="110" y="184"/>
    <use href="#create" x="164" y="184"/>
    <use href="#update" x="218" y="184"/>
    <use href="#delete" x="272" y="184"/>
    <use href="#read" x="110" y="204"/>
    <use href="#update" x="164" y="204"/>
    <use href="#delete" x="218" y="204"/>
    <use href="#create" x="272" y="204"/>
    <text x="350" y="196">2 / 4 = 0.5</text>
    <text x="560" y="196">1 − 0.5 = 0.5</text>

    <text x="20" y="250">tidy</text>
    <use href="#read" x="110" y="238"/>
    <use href="#update" x="164" y="238"/>
    <rect x="110.5" y="258.5" width="103" height="15" rx="3" fill="#ffffff" stroke="#616161"/>
    <text x="162" y="270" font-size="10" fill="#616161" text-anchor="middle">no actions</text>
    <text x="350" y="250">1: empty against non-empty</text>
    <text x="560" y="250">1 − 1 = 0</text>
  </g>

  <g fill="#9e9e9e">
    <text x="20" y="304">once</text>
    <g opacity="0.45">
      <use href="#read" x="110" y="292"/>
      <use href="#update" x="164" y="292"/>
    </g>
    <rect x="110.5" y="312.5" width="103" height="15" rx="3" fill="#ffffff" stroke="#9e9e9e" stroke-dasharray="4 3"/>
    <text x="162" y="324" font-size="10" text-anchor="middle">not recorded</text>
    <text x="350" y="304">excluded: fewer than two recordings</text>
  </g>

  <line x1="20" y1="346" x2="680" y2="346" stroke="#bdbdbd"/>
  <text x="20" y="378" fill="#212121" font-weight="600">Sequential trajectory consistency</text>
  <text x="350" y="378" fill="#1565c0" font-weight="600">(0.3333 + 0 + 0.5 + 0) / 4 = 0.2083</text>
  <text x="20" y="406" fill="#616161">Four eligible Tasks, each weighted equally. Pooling the six pairs would give 0.25 instead.</text>
  <text x="20" y="424" fill="#616161">The same Attempts give a distributional trajectory consistency of 0.8333.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Normalized edit distance of one pair of Attempts</title>
  <desc>Attempt 1 takes read, create, update, delete. Attempt 2 takes read, update, delete, create. Deleting create after read and inserting it at the end turns the first sequence into the second: a Levenshtein distance of 2. Divided by the longer length, 4, the normalized distance is 0.5.</desc>
  <defs>
    <g id="read">
      <rect width="80" height="28" rx="4" fill="#1565c0"/>
      <text x="40" y="19" fill="#ffffff" font-weight="600" text-anchor="middle">read</text>
    </g>
    <g id="create">
      <rect width="80" height="28" rx="4" fill="#2e7d32"/>
      <text x="40" y="19" fill="#ffffff" font-weight="600" text-anchor="middle">create</text>
    </g>
    <g id="update">
      <rect width="80" height="28" rx="4" fill="#ef6c00"/>
      <text x="40" y="19" fill="#ffffff" font-weight="600" text-anchor="middle">update</text>
    </g>
    <g id="delete">
      <rect width="80" height="28" rx="4" fill="#c62828"/>
      <text x="40" y="19" fill="#ffffff" font-weight="600" text-anchor="middle">delete</text>
    </g>
    <rect id="gap" x="0.5" y="0.5" width="79" height="27" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-dasharray="4 3"/>
  </defs>
  <rect width="640" height="300" fill="#ffffff"/>

  <text x="20" y="49" fill="#212121" font-weight="600">Attempt 1</text>
  <use href="#read" x="130" y="30"/>
  <use href="#create" x="226" y="30"/>
  <use href="#update" x="322" y="30"/>
  <use href="#delete" x="418" y="30"/>
  <use href="#gap" x="514" y="30"/>

  <g text-anchor="middle" font-size="12">
    <text x="170" y="82" fill="#9e9e9e">same</text>
    <text x="266" y="82" fill="#c62828" font-weight="600">delete it</text>
    <text x="362" y="82" fill="#9e9e9e">same</text>
    <text x="458" y="82" fill="#9e9e9e">same</text>
    <text x="554" y="82" fill="#c62828" font-weight="600">insert it</text>
  </g>

  <text x="20" y="119" fill="#212121" font-weight="600">Attempt 2</text>
  <use href="#read" x="130" y="100"/>
  <use href="#gap" x="226" y="100"/>
  <use href="#update" x="322" y="100"/>
  <use href="#delete" x="418" y="100"/>
  <use href="#create" x="514" y="100"/>

  <line x1="20" y1="152" x2="620" y2="152" stroke="#bdbdbd"/>
  <g fill="#212121">
    <text x="20" y="180">Levenshtein distance: 2 edits, one deletion and one insertion</text>
    <text x="20" y="204">Longer sequence: 4 actions</text>
  </g>
  <text x="20" y="238" fill="#212121" font-weight="600">Normalized edit distance</text>
  <text x="250" y="238" fill="#1565c0" font-weight="600">2 / 4 = 0.5</text>
  <text x="20" y="270" fill="#616161">Consistency of this pair: 1 − 0.5 = 0.5. Both Attempts have the same mix of actions,</text>
  <text x="20" y="288" fill="#616161">so the distributional metric gives this pair 1.</text>
</svg>

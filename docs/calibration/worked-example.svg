<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Worked example: six Attempts, five valid confidence/outcome pairs in four bins</title>
  <desc>Five Attempts have a rating and a task outcome. Their confidences 0.95, 0.9, 0.8, 0.625 and 0.3 fall into bins 10, 10, 9, 7 and 4. One Attempt answered "Fairly sure." and has no rating, so it is not used. Bin 4 has a gap of 0.3, bin 7 of 0.375, bin 9 of 0.8 and bin 10, which holds two pairs, of 0.075. Weighted by their share of the five pairs the gaps add 0.06, 0.075, 0.16 and 0.03, which sum to an expected calibration error of 0.325. Calibration is 1 minus 0.325, which is 0.675.</desc>
  <defs>
    <g id="success">
      <circle r="11" fill="#2e7d32"/>
      <polyline points="-5,0 -1,4 5,-4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="failure">
      <circle r="10" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
      <path d="M-4,-4 L4,4 M-4,4 L4,-4" stroke="#c62828" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="760" height="540" fill="#ffffff"/>
  <g fill="#616161" font-weight="600">
    <text x="20" y="30">Attempt</text>
    <text x="180" y="30">Agent's answer</text>
    <text x="300" y="30">c</text>
    <text x="370" y="30">Task outcome</text>
    <text x="490" y="30">Bin</text>
  </g>
  <line x1="20" y1="42" x2="740" y2="42" stroke="#bdbdbd"/>

  <g fill="#212121">
    <text x="20" y="75">close/attempt-1</text>
    <text x="180" y="75">95</text>
    <text x="300" y="75">0.95</text>
    <use href="#success" x="382" y="70"/>
    <text x="402" y="75">y = 1</text>
    <text x="490" y="75">10: 0.9 ≤ c ≤ 1</text>

    <text x="20" y="111">close/attempt-2</text>
    <text x="180" y="111">90</text>
    <text x="300" y="111">0.9</text>
    <use href="#success" x="382" y="106"/>
    <text x="402" y="111">y = 1</text>
    <text x="490" y="111">10: 0.9 ≤ c ≤ 1, on its lower boundary</text>

    <text x="20" y="147">close/attempt-3</text>
    <text x="180" y="147">80</text>
    <text x="300" y="147">0.8</text>
    <use href="#failure" x="382" y="142"/>
    <text x="402" y="147">y = 0</text>
    <text x="490" y="147">9: 0.8 ≤ c &lt; 0.9, on its lower boundary</text>

    <text x="20" y="183">archive/attempt-1</text>
    <text x="180" y="183">62.5</text>
    <text x="300" y="183">0.625</text>
    <use href="#success" x="382" y="178"/>
    <text x="402" y="183">y = 1</text>
    <text x="490" y="183">7: 0.6 ≤ c &lt; 0.7</text>

    <text x="20" y="219">archive/attempt-2</text>
    <text x="180" y="219">30</text>
    <text x="300" y="219">0.3</text>
    <use href="#failure" x="382" y="214"/>
    <text x="402" y="219">y = 0</text>
    <text x="490" y="219">4: 0.3 ≤ c &lt; 0.4, on its lower boundary</text>
  </g>

  <g fill="#9e9e9e">
    <text x="20" y="255">archive/attempt-3</text>
    <text x="180" y="255">Fairly sure.</text>
    <text x="300" y="255">none</text>
    <use href="#success" x="382" y="250" opacity="0.45"/>
    <text x="402" y="255">y = 1</text>
    <text x="490" y="255">not used: no rating</text>
  </g>

  <line x1="20" y1="278" x2="740" y2="278" stroke="#bdbdbd"/>
  <g fill="#616161" font-weight="600">
    <text x="20" y="304">Bin</text>
    <text x="90" y="304">Pairs</text>
    <text x="180" y="304">Mean of c</text>
    <text x="300" y="304">Mean of y</text>
    <text x="420" y="304">Gap</text>
    <text x="540" y="304">Share of pairs × gap</text>
  </g>
  <line x1="20" y1="316" x2="740" y2="316" stroke="#bdbdbd"/>
  <g fill="#212121">
    <text x="20" y="342">4</text>
    <text x="90" y="342">1</text>
    <text x="180" y="342">0.3</text>
    <text x="300" y="342">0</text>
    <text x="420" y="342">0.3</text>
    <text x="540" y="342">1/5 × 0.3 = 0.06</text>

    <text x="20" y="370">7</text>
    <text x="90" y="370">1</text>
    <text x="180" y="370">0.625</text>
    <text x="300" y="370">1</text>
    <text x="420" y="370">0.375</text>
    <text x="540" y="370">1/5 × 0.375 = 0.075</text>

    <text x="20" y="398">9</text>
    <text x="90" y="398">1</text>
    <text x="180" y="398">0.8</text>
    <text x="300" y="398">0</text>
    <text x="420" y="398">0.8</text>
    <text x="540" y="398">1/5 × 0.8 = 0.16</text>

    <text x="20" y="426">10</text>
    <text x="90" y="426">2</text>
    <text x="180" y="426">0.925</text>
    <text x="300" y="426">1</text>
    <text x="420" y="426">0.075</text>
    <text x="540" y="426">2/5 × 0.075 = 0.03</text>
  </g>

  <line x1="20" y1="446" x2="740" y2="446" stroke="#bdbdbd"/>
  <text x="20" y="476" fill="#212121" font-weight="600">Calibration</text>
  <text x="180" y="476" fill="#1565c0" font-weight="600">1 − (0.06 + 0.075 + 0.16 + 0.03) = 1 − 0.325 = 0.675</text>
  <text x="20" y="502" fill="#616161">Five valid pairs, pooled across both Tasks. Six bins are empty and add nothing.</text>
  <text x="20" y="522" fill="#616161">The Attempt without a rating is counted, not binned.</text>
</svg>

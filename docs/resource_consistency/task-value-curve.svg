<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Task value against the mean coefficient of variation</title>
  <desc>The Task value is exp(-mean of CVs). It is 1 when every resource type measures the same in every Attempt, 0.905 at a mean CV of 0.1, 0.607 at 0.5 and 0.368 at 1. It approaches 0 and never reaches it.</desc>
  <rect width="640" height="330" fill="#ffffff"/>

  <g stroke="#e0e0e0">
    <line x1="60" y1="40" x2="560" y2="40"/>
    <line x1="60" y1="95" x2="560" y2="95"/>
    <line x1="60" y1="150" x2="560" y2="150"/>
    <line x1="60" y1="205" x2="560" y2="205"/>
    <line x1="185" y1="40" x2="185" y2="260"/>
    <line x1="310" y1="40" x2="310" y2="260"/>
    <line x1="435" y1="40" x2="435" y2="260"/>
    <line x1="560" y1="40" x2="560" y2="260"/>
  </g>
  <g stroke="#616161">
    <line x1="60" y1="260" x2="560" y2="260"/>
    <line x1="60" y1="40" x2="60" y2="260"/>
  </g>

  <g fill="#616161" text-anchor="end">
    <text x="52" y="44">1</text>
    <text x="52" y="99">0.75</text>
    <text x="52" y="154">0.5</text>
    <text x="52" y="209">0.25</text>
    <text x="52" y="264">0</text>
  </g>
  <g fill="#616161" text-anchor="middle">
    <text x="60" y="280">0</text>
    <text x="185" y="280">0.5</text>
    <text x="310" y="280">1</text>
    <text x="435" y="280">1.5</text>
    <text x="560" y="280">2</text>
    <text x="310" y="308">Mean of the coefficients of variation of a Task's resource types</text>
  </g>
  <text x="18" y="150" fill="#616161" text-anchor="middle" transform="rotate(-90 18 150)">Task value</text>

  <polyline fill="none" stroke="#1565c0" stroke-width="2.5" points="60.0,40.0 72.5,50.7 85.0,60.9 97.5,70.6 110.0,79.9 122.5,88.7 135.0,97.0 147.5,105.0 160.0,112.5 172.5,119.7 185.0,126.6 197.5,133.1 210.0,139.3 222.5,145.1 235.0,150.8 247.5,156.1 260.0,161.1 272.5,166.0 285.0,170.6 297.5,174.9 310.0,179.1 322.5,183.0 335.0,186.8 347.5,190.3 360.0,193.7 372.5,197.0 385.0,200.0 397.5,203.0 410.0,205.7 422.5,208.4 435.0,210.9 447.5,213.3 460.0,215.6 472.5,217.7 485.0,219.8 497.5,221.8 510.0,223.6 522.5,225.4 535.0,227.1 547.5,228.7 560.0,230.2"/>

  <g fill="#1565c0">
    <circle cx="60" cy="40" r="5"/>
    <circle cx="85" cy="60.9" r="5"/>
    <circle cx="185" cy="126.6" r="5"/>
    <circle cx="310" cy="179.1" r="5"/>
  </g>
  <g fill="#212121">
    <text x="72" y="34">CV 0: value 1, every measurement the same</text>
    <text x="97" y="65">CV 0.1: value 0.905</text>
    <text x="197" y="124">CV 0.5: value 0.607</text>
    <text x="322" y="176">CV 1: value 0.368</text>
  </g>
</svg>

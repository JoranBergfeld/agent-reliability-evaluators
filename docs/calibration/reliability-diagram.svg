<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 392" width="620" height="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <title>The gap of each bin in the worked example</title>
  <desc>The confidence scale from 0 to 1 is cut into ten bins of width 0.1. Four bins of the worked example hold a pair. Each has a point at its mean confidence and its share of successes: bin 4 at 0.3 and 0, bin 7 at 0.625 and 1, bin 9 at 0.8 and 0, and bin 10 at 0.925 and 1. On the dashed diagonal the mean confidence equals the share of successes. The gap of a bin is the vertical distance from its point to the diagonal: 0.3, 0.375, 0.8 and 0.075. Bin 10 holds two pairs and the others one each.</desc>
  <rect width="620" height="392" fill="#ffffff"/>

  <g fill="#e3f2fd">
    <rect x="214" y="50" width="48" height="200"/>
    <rect x="358" y="50" width="48" height="200"/>
    <rect x="454" y="50" width="48" height="200"/>
    <rect x="502" y="50" width="48" height="200"/>
  </g>
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="70" y1="50" x2="550" y2="50"/>
    <line x1="70" y1="100" x2="550" y2="100"/>
    <line x1="70" y1="150" x2="550" y2="150"/>
    <line x1="70" y1="200" x2="550" y2="200"/>
    <line x1="118" y1="50" x2="118" y2="250"/>
    <line x1="166" y1="50" x2="166" y2="250"/>
    <line x1="214" y1="50" x2="214" y2="250"/>
    <line x1="262" y1="50" x2="262" y2="250"/>
    <line x1="310" y1="50" x2="310" y2="250"/>
    <line x1="358" y1="50" x2="358" y2="250"/>
    <line x1="406" y1="50" x2="406" y2="250"/>
    <line x1="454" y1="50" x2="454" y2="250"/>
    <line x1="502" y1="50" x2="502" y2="250"/>
    <line x1="550" y1="50" x2="550" y2="250"/>
  </g>
  <g stroke="#424242" stroke-width="1.5">
    <line x1="70" y1="250" x2="550" y2="250"/>
    <line x1="70" y1="50" x2="70" y2="250"/>
  </g>
  <line x1="70" y1="250" x2="550" y2="50" stroke="#616161" stroke-width="1.5" stroke-dasharray="6 4"/>

  <g fill="#424242" text-anchor="middle">
    <text x="70" y="268">0</text>
    <text x="118" y="268">0.1</text>
    <text x="166" y="268">0.2</text>
    <text x="214" y="268">0.3</text>
    <text x="262" y="268">0.4</text>
    <text x="310" y="268">0.5</text>
    <text x="358" y="268">0.6</text>
    <text x="406" y="268">0.7</text>
    <text x="454" y="268">0.8</text>
    <text x="502" y="268">0.9</text>
    <text x="550" y="268">1</text>
    <text x="310" y="312">mean confidence of the bin (c is the rating divided by 100)</text>
  </g>
  <g fill="#1565c0" text-anchor="middle">
    <text x="238" y="288">bin 4: 1 pair</text>
    <text x="382" y="288">bin 7: 1 pair</text>
    <text x="476" y="288">bin 9: 1</text>
    <text x="530" y="288">bin 10: 2</text>
  </g>
  <g fill="#424242" text-anchor="end">
    <text x="62" y="254">0</text>
    <text x="62" y="204">0.25</text>
    <text x="62" y="154">0.5</text>
    <text x="62" y="104">0.75</text>
    <text x="62" y="54">1</text>
  </g>
  <text x="22" y="150" fill="#424242" text-anchor="middle" transform="rotate(-90 22 150)">share of successes in the bin</text>

  <g stroke="#c62828" stroke-width="3">
    <line x1="214" y1="250" x2="214" y2="190"/>
    <line x1="370" y1="50" x2="370" y2="125"/>
    <line x1="454" y1="250" x2="454" y2="90"/>
    <line x1="514" y1="50" x2="514" y2="65"/>
  </g>
  <g fill="#1565c0">
    <circle cx="214" cy="250" r="5"/>
    <circle cx="370" cy="50" r="5"/>
    <circle cx="454" cy="250" r="5"/>
    <circle cx="514" cy="50" r="5"/>
  </g>
  <g fill="#c62828" font-weight="600">
    <text x="221" y="226">0.3</text>
    <text x="377" y="92">0.375</text>
    <text x="461" y="176">0.8</text>
    <text x="508" y="62" text-anchor="end">0.075</text>
  </g>

  <g fill="#212121">
    <circle cx="80" cy="336" r="5" fill="#1565c0"/>
    <text x="92" y="340">a bin that holds a pair</text>
    <line x1="238" y1="336" x2="262" y2="336" stroke="#c62828" stroke-width="3"/>
    <text x="270" y="340">its gap</text>
    <line x1="330" y1="336" x2="358" y2="336" stroke="#616161" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="366" y="340">confidence equals the share of successes</text>
    <text x="70" y="362" fill="#616161">The points of bins 4 and 9 are on a boundary: a confidence of exactly 0.3 or 0.8</text>
    <text x="70" y="378" fill="#616161">belongs to the bin that starts there.</text>
  </g>
</svg>

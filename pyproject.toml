[project]
name = "agent-reliability-evaluators"
version = "0.0.0"
description = "Reliability Evaluators for agents on Azure Foundry. Copy src/reliability_evaluators into your project; this file is development tooling only."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "-m", "not live"]
markers = [
    "live: opt-in check against a live Foundry project; excluded from the default test run",
]

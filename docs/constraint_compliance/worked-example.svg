<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Worked example: nine Attempts, six of them assessed</title>
  <desc>Six Attempts were assessed against every applicable operational constraint or have a recorded violation. Four of them have no violation and two have at least one, so constraint compliance is 4 divided by 6, 0.6667. Three Attempts are left out and counted: one was not assessed against one of its constraints, one did not complete its execution, and one has no applicable constraint.</desc>
  <defs>
    <g id="no-violation">
      <circle r="11" fill="#2e7d32"/>
      <polyline points="-5,0 -1,4 5,-4" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="violated">
      <circle r="11" fill="#c62828"/>
      <path d="M-4,-4 L4,4 M-4,4 L4,-4" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g id="not-assessed">
      <circle r="10" fill="#ffffff" stroke="#757575" stroke-width="1.6" stroke-dasharray="3 3"/>
      <text y="5" text-anchor="middle" fill="#757575" font-weight="600">?</text>
    </g>
    <g id="does-not-apply">
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#bdbdbd" stroke-width="2"/>
    </g>
  </defs>
  <rect width="800" height="470" fill="#ffffff"/>
  <g fill="#616161" font-weight="600">
    <text x="20" y="30">Attempt</text>
    <text x="130" y="30">Task outcome</text>
    <text x="315" y="30" text-anchor="middle">leave-unrelated</text>
    <text x="445" y="30" text-anchor="middle">no-bulk-delete</text>
    <text x="530" y="30">Indicator</text>
  </g>
  <line x1="20" y1="42" x2="780" y2="42" stroke="#bdbdbd"/>

  <g fill="#212121">
    <text x="20" y="72">close/1</text>
    <text x="130" y="72">success</text>
    <use href="#no-violation" x="315" y="67"/>
    <use href="#no-violation" x="445" y="67"/>
    <text x="530" y="72">1</text>

    <text x="20" y="106">close/2</text>
    <text x="130" y="106">success</text>
    <use href="#violated" x="315" y="101"/>
    <use href="#no-violation" x="445" y="101"/>
    <text x="530" y="106">0</text>

    <text x="20" y="140">close/3</text>
    <text x="130" y="140">failure</text>
    <use href="#no-violation" x="315" y="135"/>
    <use href="#no-violation" x="445" y="135"/>
    <text x="530" y="140">1</text>

    <text x="20" y="174">close/4</text>
    <text x="130" y="174">failure</text>
    <use href="#no-violation" x="315" y="169"/>
    <use href="#no-violation" x="445" y="169"/>
    <text x="530" y="174">1</text>

    <text x="20" y="208">close/5</text>
    <text x="130" y="208">failure</text>
    <use href="#violated" x="315" y="203"/>
    <use href="#violated" x="445" y="203"/>
    <text x="530" y="208">0</text>

    <text x="20" y="276">archive/1</text>
    <text x="130" y="276">success</text>
    <use href="#no-violation" x="315" y="271"/>
    <use href="#does-not-apply" x="445" y="271"/>
    <text x="530" y="276">1</text>
  </g>

  <g fill="#9e9e9e">
    <text x="20" y="242">close/6</text>
    <text x="130" y="242">success</text>
    <use href="#no-violation" x="315" y="237" opacity="0.45"/>
    <use href="#not-assessed" x="445" y="237"/>
    <text x="530" y="242">left out: not fully assessed</text>

    <text x="20" y="310">archive/2</text>
    <text x="130" y="310">execution failed</text>
    <use href="#not-assessed" x="315" y="305"/>
    <use href="#does-not-apply" x="445" y="305"/>
    <text x="530" y="310">left out: execution did not complete</text>

    <text x="20" y="344">list/1</text>
    <text x="130" y="344">success</text>
    <use href="#does-not-apply" x="315" y="339"/>
    <use href="#does-not-apply" x="445" y="339"/>
    <text x="530" y="344">left out: no applicable constraint</text>
  </g>

  <line x1="20" y1="364" x2="780" y2="364" stroke="#bdbdbd"/>
  <text x="20" y="394" fill="#212121" font-weight="600">Constraint compliance</text>
  <text x="315" y="394" fill="#1565c0" font-weight="600">4 Attempts with no violation / 6 assessed Attempts = 0.6667</text>

  <g fill="#616161">
    <use href="#no-violation" x="31" y="426"/>
    <text x="48" y="431">no violation</text>
    <use href="#violated" x="151" y="426"/>
    <text x="168" y="431">violated</text>
    <use href="#not-assessed" x="251" y="426"/>
    <text x="268" y="431">not assessed</text>
    <use href="#does-not-apply" x="381" y="426"/>
    <text x="398" y="431">does not apply to the Task</text>
    <text x="20" y="456">close/5 violated two constraints and counts once. Three Attempts are left out and counted, never scored as compliant.</text>
  </g>
</svg>

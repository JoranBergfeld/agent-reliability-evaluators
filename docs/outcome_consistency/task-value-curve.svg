<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <title>Task value as a function of the share of successful Attempts</title>
  <desc>A parabola, (2p - 1) squared. It is 1 when p is 0 or 1, 0.36 when p is 0.2 or 0.8, and 0 when p is 0.5.</desc>
  <rect width="600" height="310" fill="#ffffff"/>
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="70" y1="50" x2="550" y2="50"/>
    <line x1="70" y1="100" x2="550" y2="100"/>
    <line x1="70" y1="150" x2="550" y2="150"/>
    <line x1="70" y1="200" x2="550" y2="200"/>
    <line x1="190" y1="50" x2="190" y2="250"/>
    <line x1="310" y1="50" x2="310" y2="250"/>
    <line x1="430" y1="50" x2="430" y2="250"/>
    <line x1="550" y1="50" x2="550" y2="250"/>
  </g>
  <g stroke="#424242" stroke-width="1.5">
    <line x1="70" y1="250" x2="550" y2="250"/>
    <line x1="70" y1="50" x2="70" y2="250"/>
  </g>
  <g fill="#424242" text-anchor="middle">
    <text x="70" y="268">0</text>
    <text x="190" y="268">0.25</text>
    <text x="310" y="268">0.5</text>
    <text x="430" y="268">0.75</text>
    <text x="550" y="268">1</text>
    <text x="310" y="294">p: the share of a Task's Attempts that succeeded</text>
  </g>
  <g fill="#424242" text-anchor="end">
    <text x="62" y="254">0</text>
    <text x="62" y="204">0.25</text>
    <text x="62" y="154">0.5</text>
    <text x="62" y="104">0.75</text>
    <text x="62" y="54">1</text>
  </g>
  <text x="22" y="150" fill="#424242" text-anchor="middle" transform="rotate(-90 22 150)">Task value: (2p − 1)²</text>
  <path d="M70,50 Q310,450 550,50" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <g fill="#1565c0">
    <circle cx="70" cy="50" r="5"/>
    <circle cx="166" cy="178" r="5"/>
    <circle cx="310" cy="250" r="5"/>
    <circle cx="454" cy="178" r="5"/>
    <circle cx="550" cy="50" r="5"/>
  </g>
  <g fill="#212121" font-weight="600">
    <text x="82" y="40">every Attempt fails: 1</text>
    <text x="538" y="40" text-anchor="end">every Attempt succeeds: 1</text>
    <text x="178" y="182">1 of 5 succeed: 0.36</text>
    <text x="442" y="182" text-anchor="end">4 of 5 succeed: 0.36</text>
    <text x="310" y="234" text-anchor="middle">half succeed: 0</text>
  </g>
</svg>
